[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/security"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".task-work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff.format]
line-ending = "lf"
