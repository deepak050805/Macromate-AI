# Local development dependencies; the Flask app runs separately on the host.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-macromate}
      POSTGRES_DB: ${POSTGRES_DB:-macromate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local env file}
    ports:
      - target: 5432
        published: "${POSTGRES_PORT:-55432}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

  redis:
    image: redis:8
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your local env file}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /usr/local/bin/docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ports:
      - target: 6379
        published: "${REDIS_PORT:-56379}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --raw ping | grep -qx PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

volumes:
  postgres-data:
  redis-data:
